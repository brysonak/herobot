[package]
name = "herobot"
version = "0.1.0"
edition = "2021"

[dependencies]
poise = "0.6"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"

[profile.release]
strip = true
